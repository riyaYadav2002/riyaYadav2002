<svg width="900" height="240" viewBox="0 0 900 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6D4AFF">
        <animate attributeName="stop-color" values="#6D4AFF;#8A5CFF;#C86DD7;#8A5CFF;#6D4AFF" dur="8s" repeatCount="indefinite"/>
      </stop>
      <stop offset="50%" stop-color="#8A5CFF">
        <animate attributeName="stop-color" values="#8A5CFF;#C86DD7;#6D4AFF;#C86DD7;#8A5CFF" dur="8s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#C86DD7">
        <animate attributeName="stop-color" values="#C86DD7;#6D4AFF;#8A5CFF;#6D4AFF;#C86DD7" dur="8s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="900" height="240" fill="url(#bgGrad)"/>

  <!-- floating decorative circles -->
  <circle cx="80" cy="60" r="26" fill="url(#glow)">
    <animate attributeName="cy" values="60;40;60" dur="4s" repeatCount="indefinite"/>
  </circle>
  <circle cx="830" cy="190" r="34" fill="url(#glow)">
    <animate attributeName="cy" values="190;170;190" dur="5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="770" cy="50" r="18" fill="url(#glow)">
    <animate attributeName="cy" values="50;70;50" dur="3.5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="60" cy="180" r="20" fill="url(#glow)">
    <animate attributeName="cy" values="180;160;180" dur="4.5s" repeatCount="indefinite"/>
  </circle>

  <!-- code brackets floating -->
  <text x="120" y="130" font-family="Consolas, monospace" font-size="46" fill="#ffffff" opacity="0.18">
    &lt;/&gt;
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -8;0 0" dur="3s" repeatCount="indefinite"/>
  </text>
  <text x="740" y="110" font-family="Consolas, monospace" font-size="38" fill="#ffffff" opacity="0.18">
    { }
    <animateTransform attributeName="transform" type="translate" values="0 0;0 8;0 0" dur="3.4s" repeatCount="indefinite"/>
  </text>

  <!-- main heading -->
  <text x="450" y="110" font-family="Poppins, Verdana, sans-serif" font-size="42" font-weight="700" fill="#ffffff" text-anchor="middle">
    Hi, I'm Riya Yadav
  </text>

  <!-- typing subtitle with blinking cursor -->
  <text x="450" y="155" font-family="Poppins, Verdana, sans-serif" font-size="20" fill="#f1e9ff" text-anchor="middle">
    MCA • Front-End Developer • React.js • SQL • Python • UI/UX Designer • Figma 
  </text>
  <rect x="622" y="163" width="3" height="20" fill="#ffffff">
    <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>
  </rect>

  <!-- animated underline -->
  <line x1="350" y1="185" x2="550" y2="185" stroke="#ffffff" stroke-width="2" stroke-opacity="0.6">
    <animate attributeName="x1" values="450;350;450" dur="3s" repeatCount="indefinite"/>
    <animate attributeName="x2" values="450;550;450" dur="3s" repeatCount="indefinite"/>
  </line>
</svg>
